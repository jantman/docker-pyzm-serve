# Release: a git tag becomes an immutable, independently re-verified image in GHCR.
#
# NO REPOSITORY SECRET IS REQUIRED. GITHUB_TOKEN authenticates to GHCR, so a fork needs no
# manual credential setup to build and publish its own images. (The sibling repository,
# jantman/docker-zm-mlapi, needs a DOCKERHUB_TOKEN; dropping Docker Hub deleted that step.)
#
# Four jobs, in a deliberate order:
#
#   guard    Refuses to proceed if the pushed tag is ALREADY published. Nothing else
#            enforces immutability -- see the job for why this is not paranoia.
#   build    Compiles and pushes. The CUDA assertion lives in the Dockerfile, not here, so
#            a local `docker build` gets exactly the same gate CI does.
#   verify   Pulls the published tag BACK from the registry and re-asserts. A separate job
#            on purpose -- that independence is the whole point (FR-010).
#   release  Creates the GitHub release, gated on verify, so a release is never presented
#            as usable before it has been checked.

name: release

on:
  push:
    tags:
      - 'v*'

# contents: write -> create the GitHub release
# packages: write -> push to GHCR
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  guard:
    name: Tag immutability guard
    runs-on: ubuntu-latest
    # Generous for what it does; it exists so a hung registry call cannot sit for six hours.
    timeout-minutes: 10
    outputs:
      image: ${{ steps.names.outputs.image }}
      tags: ${{ steps.names.outputs.tags }}
      prerelease: ${{ steps.names.outputs.prerelease }}
    steps:
      - name: Compute image name and tag list
        id: names
        run: |
          # GHCR requires a lowercase path. github.repository preserves the owner's case.
          image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Image repository: ${image}"

          # A semver PRE-RELEASE is anything with a suffix after the version core --
          # v0.1.0-rc1, v0.0.1-test. Those must NOT become `latest`, and must be marked
          # as prereleases on GitHub.
          #
          # This is not cosmetic. Without it a throwaway test tag becomes both the
          # repository's headline "Latest release" and whatever `docker pull ...:latest`
          # returns -- which is how v0.0.1-test briefly presented itself as this project's
          # newest usable image. `latest` is never a recommended deployment target
          # (FR-024), but it must still not point at something that was never meant to be
          # deployed at all.
          #
          # There is no allowlisted exception any more. `-jantmanfork` was one while this
          # image pinned pyzm to a fork carrying PRs still open upstream; those PRs merged,
          # the pin is back on a ZoneMinder/pyzmNg release tag (see the Dockerfile's
          # PYZM_REF block), and the suffix has nothing left to say. If a suffix ever has
          # to take `latest` again, add it here as a LITERAL -- widening this to `-[a-z]+`
          # would readmit exactly the v0.0.1-test bug above, so do not.
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "Pre-release: ${prerelease}"

          {
            echo "tags<<TAGS_EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            if [ "${prerelease}" = "false" ]; then
              echo "${image}:latest"
            fi
            echo "TAGS_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # WHY THIS JOB EXISTS.
      #
      # FR-024 and Constitution Principle IV say a published tag MUST NEVER be overwritten,
      # moved, or deleted. Nothing enforces that on its own: GHCR accepts a second push to
      # an existing tag silently, and docker/build-push-action has no opinion about it. So
      # re-running this workflow for a tag that already exists would quietly replace it.
      #
      # And it would replace it with a DIFFERENT image: this build is not bit-reproducible
      # (the ONNX export is not -- see research R5), so the digest would move. Someone,
      # somewhere, has pinned that tag in a compose file and has no way to know.
      #
      # Fails closed. An inspect error we do not recognise is treated as "cannot prove this
      # tag is free", because publishing over a release is worse than a failed workflow run.
      - name: Fail if this tag is already published
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          echo "Checking whether ${IMAGE}:${TAG} already exists..."

          # NOTE ON THE `if` FORM -- do not "simplify" this back to assigning the
          # command's output and then testing $?.
          #
          # GitHub runs every `run:` step as `bash -e {0}`. `set -uo pipefail` above does
          # NOT cancel that -e, so a bare `output="$(... )"` whose command exits non-zero
          # kills the step instantly, before any $? test can run -- which is exactly what
          # happened the first time this job executed: it printed the line above and then
          # died with no diagnostic at all. A command inside an `if` condition is exempt
          # from -e, so this form is the fix.
          if output="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" 2>&1)"; then
            echo "::error::${IMAGE}:${TAG} is already published; a released tag must never be moved (FR-024)."
            echo ""
            echo "A released tag is an immutable promise. Someone may have pinned it in a"
            echo "compose file or a Puppet manifest and has no way to know it moved under"
            echo "them. To publish a change, cut a new version."
            echo ""
            echo "If this tag was pushed by mistake and has never been pulled by anyone,"
            echo "removing it is still the maintainer's decision, not this workflow's."
            echo ""
            echo "--- existing manifest ---"
            echo "${output}"
            exit 1
          fi

          echo "--- inspect output (non-zero exit, expected for an unpublished tag) ---"
          echo "${output}"

          if echo "${output}" | grep -qiE "not found|manifest unknown|name unknown|denied|no such|unauthorized|does not exist"; then
            echo "Tag is free. Proceeding."
            exit 0
          fi

          echo "::error::Could not determine whether ${IMAGE}:${TAG} is already published; failing closed."
          echo ""
          echo "The registry returned something that is neither success nor a recognised"
          echo "'not found'. Overwriting a released tag is worse than a failed workflow"
          echo "run, so this stops here. Inspect the output above and re-run once the"
          echo "registry is answering normally."
          exit 1

  # ===========================================================================
  build:
    name: Build and push
    needs: guard
    runs-on: ubuntu-latest
    # Well below the 6-hour hard cap, so a runaway OpenCV compile fails as a legible
    # timeout with a clear cause rather than being killed at the ceiling (research R8).
    # If this trips, the escalation order is in research.md R8 -- and its last two steps
    # are the maintainer's decision, not an automated one.
    timeout-minutes: 330
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: no QEMU set-up step, deliberately. linux/amd64 only (FR-020). An emulated
      # CUDA compile would not finish inside any timeout this runner can offer.
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Computed by the guard job: always the version tag, plus `latest` only for a
          # real release. A pre-release tag never becomes `latest`.
          tags: ${{ needs.guard.outputs.tags }}
          labels: |
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          # Registry-backed cache, not type=gha: an OpenCV CUDA build blows straight
          # through GitHub's 10 GB per-repository Actions cache budget (research R8).
          #
          # `buildcache` is MUTABLE by design and is the one deliberate exception to this
          # project's immutability habit. It holds BuildKit layer manifests, not a runnable
          # image, so it is neither a release nor deployable and does not engage FR-024
          # (RT-2). It is named so nobody can mistake it for something to deploy.
          cache-from: type=registry,ref=${{ needs.guard.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.guard.outputs.image }}:buildcache,mode=max

      - name: Report what was published
        run: |
          echo "Published ${{ needs.guard.outputs.image }}:${{ github.ref_name }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # ===========================================================================
  verify:
    name: Verify the published image
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A SEPARATE JOB, pulling from the registry, sharing nothing with the build. That is
      # the requirement, not an implementation detail: this catches a bad layer-cache hit,
      # a wrong tag, or a registry mixup -- none of which are visible from inside a build.
      #
      # Runs on a GPU-less runner because it asserts what was COMPILED, not what is
      # AVAILABLE (FR-027). The runtime GPU proof cannot be done here and is not attempted;
      # it belongs to the maintainer on real hardware before the release is announced.
      - name: Pull back and re-assert CUDA
        run: |
          ./scripts/verify-published.sh \
            "${{ needs.guard.outputs.image }}:${{ github.ref_name }}"

  # ===========================================================================
  release:
    name: Create GitHub release
    # Gated on verify, so a release is never presented as usable before the published image
    # has been pulled back and checked (FR-026, PIm-2).
    needs: [guard, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # `gh` rather than a third-party release action: it is preinstalled on GitHub-hosted
      # runners, authenticates with the GITHUB_TOKEN already in scope, and adds no
      # supply-chain surface or extra pin to maintain. (actions/create-release, which the
      # obvious search result still suggests, is archived.)
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.guard.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "## Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Pinning by digest is stronger than pinning by tag. Release tags are"
            echo "immutable either way; \`latest\` is not a deployment target."
            echo
            echo "## Verification"
            echo
            echo "This image was pulled back from GHCR and re-asserted to have been"
            echo "compiled with CUDA before this release was created."
            echo
            echo "**A release is not confirmed until it has also been verified on real GPU"
            echo "hardware.** CI proves the build; only a GPU proves the runtime. See the"
            echo "GPU verification section of the README."
            echo
            echo "## Changes"
            echo
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" --jq '.body' 2>/dev/null || echo "_See the commit log._"
            echo
            echo "### Breaking changes"
            echo
            echo "Review and edit this section by hand before announcing. Per FR-028, a"
            echo "release MUST explicitly call out any of: a removed model, a changed"
            echo "default, a dropped GPU generation, or a new required setting. A user must"
            echo "be able to judge from the tag alone whether an upgrade is safe."
          } > release-notes.md

          # --prerelease keeps a pre-release tag from being presented as the repository's
          # headline "Latest release". Users judge whether an upgrade is safe from the tag
          # (FR-028, Principle IV); a test tag sitting at the top of the releases page
          # actively works against that.
          prerelease_flag=""
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --verify-tag \
            ${prerelease_flag}
